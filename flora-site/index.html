<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>FLORA KONAKLARI | ADMIN Giriş</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#071b19;color:#f4f3e9;font:14px system-ui,Arial;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:100%;max-width:370px;background:#102c28;border:1px solid #37695d;border-radius:16px;padding:22px 18px;box-shadow:0 12px 35px #0004}.eyebrow{color:#80ddc8;font-size:11px;letter-spacing:2px;font-weight:800}h1{font-size:23px;letter-spacing:1px;color:#e8cb8b;margin:9px 0 5px}h2{font-size:16px;color:#e8cb8b;margin:20px 0 12px}p{font-size:12px;color:#a7c2b8;line-height:1.5}label{display:block;font-size:12px;color:#c4d5ce;margin:13px 0 5px}input{width:100%;padding:12px;border:1px solid #528678;background:#071d1b;border-radius:9px;color:white;font-size:16px}button{width:100%;margin-top:17px;border:1px solid #86d7c3;background:#22685a;color:white;padding:12px;border-radius:9px;font-weight:800;font-size:14px}button:disabled{opacity:.5}#status{margin-top:14px;white-space:pre-wrap;overflow-wrap:anywhere}.foot{margin-top:18px;border-top:1px solid #37695d;padding-top:12px}</style>
</head><body><main class="card"><div class="eyebrow">RATA SITE • YÖNETİM</div><h1>FLORA KONAKLARI</h1><p>Site yönetim merkezi</p><h2>🔐 ADMIN GİRİŞİ</h2><form id="login"><label for="email">E-posta</label><input id="email" type="email" autocomplete="username" required><label for="password">Şifre</label><input id="password" type="password" autocomplete="current-password" required><button id="submit" type="submit">GİRİŞ YAP</button></form><p id="status" role="status">Bağlantı hazırlanıyor…</p><p class="foot">Bu sayfa giriş bağlantısı testidir. Yönetim paneli ve gerçek sakin kayıtları henüz yayınlanmamıştır.</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
'use strict';
const SUPABASE_URL='https://yngbowhkgxelwzgkbmy.supabase.co';
const SUPABASE_PUBLISHABLE='sb_publishable_nUZKESoFlyXulkvKkPTv1w_AQHGgvh_';
const statusEl=document.getElementById('status'),submitEl=document.getElementById('submit');
let client=null;
function status(s){statusEl.textContent=s}
function busy(v){submitEl.disabled=v;submitEl.textContent=v?'KONTROL EDİLİYOR…':'GİRİŞ YAP'}
async function verifyAdmin(user){
 if(!user)return false;
 const {data,error}=await client.from('site_memberships').select('site_id,role,is_active,sites!inner(name)').eq('user_id',user.id).eq('role','admin').eq('is_active',true).eq('sites.name','FLORA KONAKLARI').limit(1);
 if(error)throw error;
 return !!(data&&data.length);
}
async function init(){
 try{
  if(!window.supabase?.createClient)throw new Error('Supabase kütüphanesi yüklenemedi');
  client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE);
  const {data,error}=await client.auth.getUser();
  if(error && !/session missing/i.test(error.message||''))throw error;
  if(data?.user){if(await verifyAdmin(data.user)){status('ADMIN hesabı doğrulandı. Yönetim paneli güvenlik hazırlığı tamamlanınca bağlanacak.');return;}await client.auth.signOut()}
  status('ADMIN hesabınızla giriş yapın.');
 }catch(e){status('Bağlantı kontrolü: '+(e.message||'Bilinmeyen hata'))}
}
document.getElementById('login').addEventListener('submit',async e=>{
 e.preventDefault();if(!client){status('Supabase bağlantısı kurulamadı.');return}
 busy(true);status('Hesap ve ADMIN yetkisi kontrol ediliyor…');
 try{
  const {data,error}=await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});
  document.getElementById('password').value='';
  if(error)throw error;
  if(!await verifyAdmin(data.user)){await client.auth.signOut();throw new Error('Bu hesap için aktif FLORA KONAKLARI ADMIN yetkisi bulunamadı.')}
  status('ADMIN girişi doğrulandı. Yönetim paneli henüz yayında değil.');
 }catch(err){status('Giriş başarısız: '+(err.message||'Bilinmeyen hata'))}
 finally{busy(false)}
});
init();
</script></body></html>
