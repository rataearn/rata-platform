<script>
async function loadUsdcBalance() {
  const balanceElement = document.getElementById('usdcBalance');

  const {
    data: { user },
    error: userError
  } = await rataSupabase.auth.getUser();

  if (userError || !user) {
    balanceElement.textContent = '0.00 USDC';
    return;
  }

  const { data, error } = await rataSupabase
    .from('balances')
    .select('available_balance')
    .eq('user_id', user.id)
    .eq('asset', 'USDC')
    .maybeSingle();

  if (error) {
    console.error('RATA bakiye okuma hatası:', error);
    balanceElement.textContent = '0.00 USDC';
    return;
  }

  const balance = Number(data?.available_balance ?? 0);
  balanceElement.textContent = balance.toFixed(2) + ' USDC';
}

loadUsdcBalance();
// 90.3 - AUTH ENGINE / OTURUM DURUMU

const authLoggedOut = document.getElementById('authLoggedOut');
const authLoggedIn = document.getElementById('authLoggedIn');
const authUserEmail = document.getElementById('authUserEmail');

async function refreshAuthUI() {
  const {
    data: { user }
  } = await rataSupabase.auth.getUser();

  if (user) {
    authLoggedOut.hidden = true;
    authLoggedIn.hidden = false;
    authUserEmail.textContent = user.user_metadata?.nickname || user.email || '';
  } else {
    authLoggedOut.hidden = false;
    authLoggedIn.hidden = true;
    authUserEmail.textContent = '';
  }

  await loadUsdcBalance();
}

// 90.3.1 - RECOVERY MODUNDA NORMAL AUTH EKRANINI KİLİTLE

rataSupabase.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY') {
    isPasswordRecovery = true;
    return;
  }

  if (isPasswordRecovery) return;

  refreshAuthUI();
});

if (

  window.location.search.includes('type=recovery')
) {
  isPasswordRecovery = true;
} else {
  refreshAuthUI();
}

if (

  resetPasswordBox.hidden = true;

<!-- 90.5A - PHANTOM BASE58 YARDIMCILARI -->
<script>
  const BASE58_ALPHABET =
    '123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';

  function base58Encode(bytes) {
    if (!bytes || bytes.length === 0) return '';

    let digits = [0];

    for (let i = 0; i < bytes.length; i++) {
      let carry = bytes[i];

      for (let j = 0; j < digits.length; j++) {
        carry += digits[j] << 8;
        digits[j] = carry % 58;
        carry = (carry / 58) | 0;
      }

      while (carry > 0) {
        digits.push(carry % 58);
        carry = (carry / 58) | 0;
      }
    }

    let result = '';

    for (let i = 0; i < bytes.length && bytes[i] === 0; i++) {
      result += '1';
    }

    for (let i = digits.length - 1; i >= 0; i--) {
      result += BASE58_ALPHABET[digits[i]];
    }

    return result;
  }

  function base58Decode(value) {
    if (!value) return new Uint8Array();

    const bytes = [0];

    for (let i = 0; i < value.length; i++) {
      const charIndex = BASE58_ALPHABET.indexOf(value[i]);

      if (charIndex < 0) {
        throw new Error('Geçersiz Base58 karakteri.');
      }

      let carry = charIndex;

      for (let j = 0; j < bytes.length; j++) {
        carry += bytes[j] * 58;
        bytes[j] = carry & 0xff;
        carry >>= 8;
      }

      while (carry > 0) {
        bytes.push(carry & 0xff);
        carry >>= 8;
      }
    }

    for (let i = 0; i < value.length && value[i] === '1'; i++) {
      bytes.push(0);
    }

    return new Uint8Array(bytes.reverse());
  }
</script>

      const provider =
        window.phantom?.solana ||
        (window.solana?.isPhantom ? window.solana : null);

      // Phantom tarayıcısında / eklenti mevcutsa doğrudan bağlan.
      if (provider?.isPhantom) {
        const response = await provider.connect();

        const address =
          response?.publicKey?.toString() ||
          provider.publicKey?.toString() ||
          '';

        if (!address) {
          throw new Error('Phantom cüzdan adresi alınamadı.');
        }

        await showConnectedPhantom(address);
        return;
      }

      // Mobil normal tarayıcı -> Phantom Connect deeplink.
      if (!window.nacl) {
        throw new Error('Phantom bağlantı sistemi yüklenemedi.');
      }

      const dappKeyPair = nacl.box.keyPair();
      const dappPublicKey = base58Encode(dappKeyPair.publicKey);

      localStorage.setItem(
        'rata_phantom_dapp_secret_key',
        Array.from(dappKeyPair.secretKey).join(',')
      );

      const rataUrl =
        window.location.origin + window.location.pathname;

      const params = new URLSearchParams({
        app_url: rataUrl,
        dapp_encryption_public_key: dappPublicKey,
        redirect_link: rataUrl
      });

      window.location.href =
        'https://phantom.app/ul/v1/connect?' +
        params.toString();

    } catch (error) {
      console.error('Phantom bağlantı hatası:', error);
      alert(
        'Phantom bağlantısı tamamlanamadı: ' +
        (error?.message || error)
      );
    }
  });
}

// Phantom onayından RATA'ya dönüldüğünde cevabı çöz.
(async () => {
  const params = new URLSearchParams(window.location.search);

  const phantomEncryptionPublicKey =
    params.get('phantom_encryption_public_key');
  const nonce = params.get('nonce');
  const data = params.get('data');

  if (!phantomEncryptionPublicKey || !nonce || !data) {
    return;
  }

  try {
    const storedSecretKey =
      localStorage.getItem('rata_phantom_dapp_secret_key');

    if (!storedSecretKey) {
      throw new Error(
        'Phantom geçici bağlantı anahtarı bulunamadı.'
      );
    }

    const dappSecretKey = new Uint8Array(
      storedSecretKey.split(',').map(Number)
    );

    const decrypted = nacl.box.open(
      base58Decode(data),
      base58Decode(nonce),
      base58Decode(phantomEncryptionPublicKey),
      dappSecretKey
    );

    if (!decrypted) {
      throw new Error('Phantom bağlantı yanıtı çözülemedi.');
    }

    const payload = JSON.parse(
      new TextDecoder().decode(decrypted)
    );

    const address = payload?.public_key || '';

    if (!address) {
      throw new Error('Phantom cüzdan adresi alınamadı.');
    }

    await showConnectedPhantom(address);
    const {
  data: { user }
} = await rataSupabase.auth.getUser();

if (!user) {
  throw new Error('Cüzdanı bağlamak için giriş yapmalısınız.');
}
const { error: walletSaveError } = await rataSupabase
  .from('wallets')
  .insert({
    user_id: user.id,
    wallet_address: address,
    network: 'solana',
    wallet_provider: 'phantom',
    is_primary: true,
    is_verified: false
  });

if (walletSaveError) {
  throw new Error('Cüzdan kaydedilemedi: ' + walletSaveError.message);
}
    localStorage.setItem(
      'rata_connected_wallet',
      address
    );

    localStorage.removeItem(
      'rata_phantom_dapp_secret_key'
    );

    window.history.replaceState(
      {},
      '',
      window.location.pathname
    );

  } catch (error) {
    console.error(
      'Phantom deeplink bağlantı hatası:',
      error
    );

    localStorage.removeItem(
      'rata_phantom_dapp_secret_key'
    );

    alert(
      'Phantom bağlantısı tamamlanamadı: ' +
      (error?.message || error)
    );
  }
})();
// Sayfa açıldığında daha önce bağlanan Phantom cüzdanını geri yükle.
const savedPhantomWallet = localStorage.getItem('rata_connected_wallet');

if (savedPhantomWallet) {
  showConnectedPhantom(savedPhantomWallet);
}
</script>
