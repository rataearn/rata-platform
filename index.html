<!-- 90 — JAVASCRIPT BAŞLANGICI -->
<script>
  // RATA uygulama kodları burada modüler olarak geliştirilecek.
    // 90.1 - THEME ENGINE / 4 TEMA
    const themeButtons = document.querySelectorAll('.theme-btn');

    themeButtons.forEach((button) => {
      button.addEventListener('click', () => {
        const theme = button.dataset.theme;

        if (theme === 'gold') {
          document.body.removeAttribute('data-theme');
        } else {
          document.body.setAttribute('data-theme', theme);
        }
      });
    });
</script>
<!-- 90.2 - USDC BAKİYE VERİ BAĞLANTISI -->
<script>
async function loadUsdcBalance() {
  const balanceElement = document.getElementById('usdcBalance');

  const {
    data: { user },
    error: userError
  } = await rataSupabase.auth.getUser();

  if (userError || !user) {
    balanceElement.textContent = '0.00 USDC';
    return;
  }

  const { data, error } = await rataSupabase
    .from('balances')
    .select('available_balance')
    .eq('user_id', user.id)
    .eq('asset', 'USDC')
    .maybeSingle();

  if (error) {
    console.error('RATA bakiye okuma hatası:', error);
    balanceElement.textContent = '0.00 USDC';
    return;
  }

  const balance = Number(data?.available_balance ?? 0);
  balanceElement.textContent = balance.toFixed(2) + ' USDC';
}

loadUsdcBalance();
// 90.3 - AUTH ENGINE / OTURUM DURUMU

const authLoggedOut = document.getElementById('authLoggedOut');
const authLoggedIn = document.getElementById('authLoggedIn');
const authUserEmail = document.getElementById('authUserEmail');

async function refreshAuthUI() {
  const {
    data: { user }
  } = await rataSupabase.auth.getUser();

  if (user) {
    authLoggedOut.hidden = true;
    authLoggedIn.hidden = false;
    authUserEmail.textContent = user.user_metadata?.nickname || user.email || '';
  } else {
    authLoggedOut.hidden = false;
    authLoggedIn.hidden = true;
    authUserEmail.textContent = '';
  }

  await loadUsdcBalance();
}

// 90.3.1 - RECOVERY MODUNDA NORMAL AUTH EKRANINI KİLİTLE
let isPasswordRecovery = false;

rataSupabase.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY') {
    isPasswordRecovery = true;
    return;
  }

  if (isPasswordRecovery) return;

  refreshAuthUI();
});

// Recovery linki ile açıldıysa normal giriş ekranını çalıştırma
if (
  window.location.hash.includes('type=recovery') ||
  window.location.search.includes('type=recovery')
) {
  isPasswordRecovery = true;
} else {
  refreshAuthUI();
}
// 90.4 - AUTH ACTIONS / KAYIT - GIRIS - CIKIS

const authNickname = document.getElementById('authNickname');
const authEmail = document.getElementById('authEmail');
const authPassword = document.getElementById('authPassword');
const authMessage = document.getElementById('authMessage');

const loginBtn = document.getElementById('loginBtn');
const registerBtn = document.getElementById('registerBtn');
const logoutBtn = document.getElementById('logoutBtn');

// 90.4.1 - KAYIT OL
registerBtn.addEventListener('click', async () => {
  const nickname = authNickname.value.trim();
  const email = authEmail.value.trim();
  const password = authPassword.value;

  authMessage.textContent = '';

  if (!nickname || !email || !password) {
    authMessage.textContent = 'Rumuz, e-posta ve şifre gerekli.';
    return;
  }

  const { error } = await rataSupabase.auth.signUp({
    email,
    password,
    options: {
      data: {
        nickname: nickname
      }
    }
  });

  if (error) {
    authMessage.textContent = error.message;
    return;
  }

  authMessage.textContent = 'Kayıt başarılı.';
});

// 90.4.2 - GIRIS YAP
loginBtn.addEventListener('click', async () => {
  const email = authEmail.value.trim();
  const password = authPassword.value;

  authMessage.textContent = '';

  if (!email || !password) {
    authMessage.textContent = 'E-posta ve şifre gerekli.';
    return;
  }

  const { error } = await rataSupabase.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    authMessage.textContent = error.message;
    return;
  }

  authMessage.textContent = '';
});

// 90.4.3 - CIKIS YAP
logoutBtn.addEventListener('click', async () => {
  const { error } = await rataSupabase.auth.signOut();

  if (error) {
    console.error('RATA çıkış hatası:', error);
  }
});
// 90.4.4 - ŞİFREMİ UNUTTUM
const forgotPasswordBtn = document.getElementById('forgotPasswordBtn');

forgotPasswordBtn.addEventListener('click', async () => {
  const email = authEmail.value.trim();

  authMessage.textContent = '';

  if (!email) {
    authMessage.textContent = 'E-posta adresini gir.';
    return;
  }

  const { error } = await rataSupabase.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.href
  });

  if (error) {
    authMessage.textContent = error.message;
    return;
  }

  authMessage.textContent = 'Şifre yenileme bağlantısı e-posta adresine gönderildi.';
});
// 90.4.5 - YENİ ŞİFRE BELİRLEME
const resetPasswordBox = document.getElementById('resetPasswordBox');
const newPassword = document.getElementById('newPassword');
const updatePasswordBtn = document.getElementById('updatePasswordBtn');

// 90.4.5.1 - ŞİFRE KURTARMA EKRANI
const showPasswordRecovery = () => {
  resetPasswordBox.hidden = false;
  authMessage.textContent = 'Yeni şifrenizi belirleyin.';
};

rataSupabase.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY') {
    showPasswordRecovery();
  }
});

if (
  window.location.hash.includes('type=recovery') ||
  window.location.search.includes('type=recovery')
) {
  showPasswordRecovery();
}

updatePasswordBtn.addEventListener('click', async () => {
  const password = newPassword.value;

  if (!password || password.length < 6) {
    authMessage.textContent = 'Yeni şifre en az 6 karakter olmalı.';
    return;
  }

  const { error } = await rataSupabase.auth.updateUser({
    password: password
  });

  if (error) {
    authMessage.textContent = error.message;
    return;
  }

  authMessage.textContent = 'Şifreniz başarıyla yenilendi.';
  newPassword.value = '';
  resetPasswordBox.hidden = true;
});
</script>

<!-- 90.7 - PHANTOM CÜZDAN BAĞLANTISI -->
<script>
  const phantomBtn = document.querySelector(
    '[data-wallet-provider="phantom"]'
  );

  if (phantomBtn) {
    phantomBtn.addEventListener('click', async () => {
      try {
        const provider = window.phantom?.solana;

        // Phantom tarayıcıya bağlıysa doğrudan bağlan
        if (provider?.isPhantom) {
          const response = await provider.connect();
          const walletAddress = response.publicKey.toString();

          document.getElementById('walletMessage').textContent =
            'Phantom cüzdanı bağlandı.';

          document.getElementById('connectedWalletAddress').textContent =
            walletAddress;

          document.getElementById('connectedWalletInfo').hidden = false;
          document.getElementById('connectWalletBtn').hidden = true;
          document.getElementById('disconnectWalletBtn').hidden = false;
          document.getElementById('walletProviderSelector').hidden = true;

          return;
        }

        // Mobil tarayıcıdaysa RATA sayfasını Phantom içinde aç
        const currentUrl = window.location.href;
        const phantomUrl =
          'https://phantom.app/ul/browse/' +
          encodeURIComponent(currentUrl) +
          '?ref=' +
          encodeURIComponent(window.location.origin);

        window.location.href = phantomUrl;

      } catch (error) {
        console.error('Phantom bağlantı hatası:', error);
        alert('Phantom bağlantısı tamamlanamadı.');
      }
    });
  }
</script>
